<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-controls">
        <button
          id="account-toggle"
          class="account-toggle"
          type="button"
          aria-label="Account"
          aria-expanded="false"
          aria-controls="account-menu"
        >&#128100;</button>
        <div id="account-menu" class="account-menu hidden">
          <p id="account-status">Not signed in</p>
          <button id="login-open" type="button">Teacher sign in</button>
          <button id="logout-button" class="hidden" type="button">Sign out</button>
          <p id="account-error" class="error hidden" aria-live="polite"></p>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="login-dialog">
      <form id="login-form">
        <h3>Teacher sign in</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="error hidden" aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="submit">Sign in</button>
          <button id="login-cancel" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
